version: 2

models:
  - name: dim_employees
    description: "Dimension table for employees enriched with operational performance KPIs."
    columns:
      - name: employee_id
        description: "Unique identifier for the employee."
        tests:
          - unique
          - not_null

      - name: full_name
        description: "Employee full name."

      - name: hire_date
        description: "Date when the employee was hired."

      - name: nb_commandes_traitees
        description: "Number of orders processed by the employee."

      - name: ca_total
        description: "Total sales amount generated by the employee."

      - name: taux_livraison_a_temps
        description: "Share of deliveries completed on time for the employee."

      - name: delai_moyen_livraison
        description: "Average delivery delay for the employee."
