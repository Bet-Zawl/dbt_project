version: 2

models:
  - name: int_employees_stats
    description: "Employee-level sales and delivery performance metrics"
    columns:
      - name: employee_id
        description: "Identifier of the employee"
        tests:
          - not_null
          - unique
      - name: full_name
        description: "Employee full name"
      - name: hire_date
        description: "Employee hire date"
      - name: nb_commandes_traitees
        description: "Number of orders handled by the employee"
      - name: ca_total
        description: "Total sales amount generated by the employee"
      - name: taux_livraison_a_temps
        description: "Share of orders delivered on time"
      - name: delai_moyen_livraison
        description: "Average delivery delay in days"
