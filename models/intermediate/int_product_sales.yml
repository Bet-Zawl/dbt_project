version: 2

models:
  - name: int_product_sales
    description: "Intermediate model combining orders, order details, and product attributes for sales analysis."
    columns:
      - name: order_id
        description: "Identifier of the order."
        tests:
          - not_null
      - name: customer_id
        description: "Identifier of the customer who placed the order."
        tests:
          - not_null
      - name: order_date
        description: "Date when the order was placed."
      - name: shipped_date
        description: "Date when the order was shipped."
      - name: ship_country
        description: "Country where the order was shipped."
      - name: product_id
        description: "Identifier of the product in the order line."
        tests:
          - not_null
      - name: product_name
        description: "Name of the product."
      - name: category_id
        description: "Identifier of the product category."
      - name: category_name
        description: "Name of the product category."
      - name: quantity
        description: "Quantity of the product ordered."
        tests:
          - not_null
      - name: unit_price
        description: "Unit price of the product."
        tests:
          - not_null
      - name: discount
        description: "Discount applied to the order line."
      - name: line_amount
        description: "Calculated line amount after applying the discount."
        tests:
          - not_null
