version: 2

models:
  - name: stg_products
    description: Staging model for Northwind products.
    columns:
      - name: product_id
        description: Primary key for the product.
        tests:
          - unique
          - not_null
      - name: product_name
        description: Name of the product.
        tests:
          - not_null
      - name: supplier_id
        description: Identifier of the supplier.
      - name: category_id
        description: Identifier of the category.
      - name: quantity_per_unit
        description: Quantity and unit of the product packaging.
      - name: unit_price
        description: Unit price of the product.
      - name: units_in_stock
        description: Quantity of units currently in stock.
      - name: units_on_order
        description: Quantity of units ordered but not yet received.
      - name: reorder_level
        description: Reorder level threshold for the product.
      - name: discontinued
        description: Indicates whether the product is discontinued.
        tests:
          - not_null
      - name: en_stock
        description: Indicates whether the product has stock available.
        tests:
          - not_null
