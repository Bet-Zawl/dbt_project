version: 2

models:
  - name: stg_order_details
    description: Staging model for order line items from the Northwind order_details table.
    columns:
      - name: order_id
        description: Identifier of the order.
        tests:
          - not_null

      - name: product_id
        description: Identifier of the product ordered.
        tests:
          - not_null

      - name: unit_price
        description: Unit price of the product.
        tests:
          - not_null

      - name: quantity
        description: Quantity ordered for the product.
        tests:
          - not_null

      - name: discount
        description: Discount applied to the order line.

      - name: sous_total
        description: Calculated subtotal for the order line after applying the discount.
        tests:
          - not_null
